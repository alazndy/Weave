name: Windows desktop build

# Builds the Electron app for Windows (NSIS installer + portable zip).
# Runs on pushes to `integration`, on version tags (v*) and by hand (Actions → Run workflow).
# Tag builds also publish the files as a GitHub Release.
on:
  push:
    branches: [integration]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to attach files to a release on tag builds

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release builds take the app version from the tag (v1.2.3 -> 1.2.3); the in-app updater compares versions.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          npm pkg set version=$v

      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test

      - name: Build web app and Electron main process
        run: |
          pnpm run build
          pnpm run electron:typecheck
          pnpm run electron:compile

      # Code signing is optional: when the WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD secrets exist
      # (a .pfx/.p12 certificate, base64 or URL + its password) electron-builder signs the
      # installer and the exe. Without them the build is unsigned (SmartScreen will warn).
      - name: Package (NSIS installer + zip)
        run: pnpm exec electron-builder --win nsis zip --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: weave-windows
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
            release/*.blockmap
            release/latest.yml
